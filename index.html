<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Honda · Diagnóstico de biointeriorismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EEDD;
    --paper:#FFFBF2;
    --ink:#2B241E;
    --ink-soft:#5B5147;
    --brick:#A4472A;
    --brick-dark:#833A22;
    --river:#2E5C54;
    --river-light:#4C7C71;
    --gold:#C4922E;
    --sage:#8B9A80;
    --line: rgba(43,36,30,0.14);
    --line-strong: rgba(43,36,30,0.28);
    --shadow: 0 18px 40px -22px rgba(43,36,30,0.35);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% 4%, rgba(196,146,46,0.10), transparent 40%),
      radial-gradient(circle at 96% 88%, rgba(46,92,84,0.10), transparent 42%);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brick);
  }
  #app{max-width:820px;margin:0 auto;padding:28px 20px 90px;}
  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:999px;
    padding:13px 26px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line-strong);
  }
  .btn.brick{background:var(--brick); border-color:var(--brick); color:#fff;}
  .btn[disabled]{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}
  .row-actions{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:34px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  ::selection{background:var(--gold); color:#fff;}
  input[type=text], input[type=number], textarea, select{
    font-family:'Work Sans', sans-serif;
    font-size:15.5px;
    padding:13px 15px;
    border-radius:12px;
    border:1.5px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    width:100%;
    outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--river);}
  textarea{resize:vertical; min-height:88px; font-family:'Work Sans';}

  /* ---------- RIVER PROGRESS ---------- */
  .river-wrap{margin: 6px 0 38px;}
  .river-label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .river-stops{position:relative; height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px;}
  .river-line{
    position:absolute; left:20px; right:20px; top:20px; height:3px;
    background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 11px);
    border-radius:2px;
  }
  .river-fill{
    position:absolute; left:20px; top:20px; height:3px;
    background:linear-gradient(90deg, var(--river), var(--gold));
    border-radius:2px; width:0;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .river-stop{
    position:relative; z-index:2; top:auto; left:auto !important; width:32px; height:32px; flex:0 0 32px; margin:0;
    border-radius:50%;
    background:var(--paper);
    border:2.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft);
    transition:all .4s ease;
  }
  .river-stop.done{background:var(--river); border-color:var(--river); color:#fff;}
  .river-stop.current{background:var(--brick); border-color:var(--brick); color:#fff; box-shadow:0 0 0 5px rgba(164,71,42,0.16);}
  .river-names{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-top:4px;}
  .river-name{position:static; transform:none; font-size:9px; line-height:1.15; color:var(--ink-soft); font-family:'IBM Plex Mono'; text-align:center; white-space:normal; overflow-wrap:anywhere;}
  @media(max-width:560px){.river-name{font-size:8px;} .river-stops{gap:3px;} .river-stop{width:28px;height:28px;flex-basis:28px;font-size:10px;} .river-line{left:16px;right:16px;top:20px;} .river-fill{left:16px;top:20px;}}

  /* ---------- WELCOME ---------- */
  .hero{padding:56px 8px 10px;}
  .hero .kicker{margin-bottom:18px;}
  .hero h1{font-size:clamp(34px,6vw,52px); line-height:1.04; margin:0 0 22px; max-width:600px;}
  .hero p.lead{font-size:17.5px; line-height:1.6; color:var(--ink-soft); max-width:540px; margin:0 0 30px;}
  .river-motif{
    width:100%; height:140px; margin:8px 0 36px;
    border-radius:22px;
    background:
      radial-gradient(60% 80% at 15% 30%, rgba(196,146,46,0.35), transparent 60%),
      radial-gradient(70% 90% at 85% 70%, rgba(46,92,84,0.4), transparent 60%),
      linear-gradient(120deg, #E9DEC2, #DCCFA9 40%, #C9DCD4 75%, #AFC9C0);
    position:relative; overflow:hidden;
  }
  .river-motif svg{position:absolute; inset:0; width:100%; height:100%;}
  .meta-line{display:flex; gap:22px; flex-wrap:wrap; font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft); margin-top:30px;}
  .meta-line span{display:flex; align-items:center; gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--brick);display:inline-block;}

  /* ---------- SELECT PERSON ---------- */
  .people-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:26px 0;}
  @media(max-width:560px){.people-grid{grid-template-columns:1fr;}}
  .person-card{
    padding:18px 18px 16px; cursor:pointer; transition:all .2s ease;
  }
  .person-card:hover{transform:translateY(-2px); box-shadow:0 22px 40px -20px rgba(43,36,30,0.4);}
  .person-card .pname{font-family:'Fraunces'; font-size:19px; margin:0 0 3px;}
  .person-card .prel{font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono';}
  .status-pill{
    display:inline-block; margin-top:10px; font-size:10.5px; font-family:'IBM Plex Mono';
    padding:4px 10px; border-radius:999px; letter-spacing:.04em;
  }
  .status-pill.complete{background:rgba(46,92,84,0.14); color:var(--river);}
  .status-pill.progress{background:rgba(196,146,46,0.18); color:var(--brick-dark);}
  .new-person-form{padding:24px; margin-top:8px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:7px; font-weight:500;}
  .checkbox-row{display:flex; align-items:flex-start; gap:10px; margin-top:6px; padding:12px 14px; background:rgba(46,92,84,0.06); border-radius:12px;}
  .checkbox-row input{width:auto; margin-top:3px;}
  .checkbox-row .ctext{font-size:13.5px; color:var(--ink-soft); line-height:1.4;}

  /* ---------- QUESTION ---------- */
  .interstitial{padding:70px 10px; text-align:center;}
  .interstitial p{font-family:'Fraunces'; font-style:italic; font-size:23px; line-height:1.5; color:var(--ink); max-width:480px; margin:0 auto;}
  .q-card{padding:26px 24px 24px;}
  @media(max-width:560px){.q-card{padding:24px 18px 20px;}}
  .q-eyebrow{margin-bottom:14px;}
  .q-text{font-size:clamp(21px,3.4vw,27px); line-height:1.28; margin:0 0 6px; max-width:560px;}
  .q-help{font-size:13.5px; color:var(--ink-soft); margin:0 0 24px;}

  .chip-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{
    padding:11px 18px; border-radius:999px; border:1.5px solid var(--line-strong);
    background:var(--paper); font-size:14.5px; cursor:pointer; user-select:none;
    transition:all .15s ease; color:var(--ink);
  }
  .chip:hover{border-color:var(--river);}
  .chip.selected{background:var(--river); border-color:var(--river); color:#fff;}
  .chip .em{margin-right:7px;}

  .maxnote{font-size:12px; color:var(--sage); margin-top:14px; font-family:'IBM Plex Mono';}

  .concept-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){.concept-grid{grid-template-columns:1fr;}}
  .concept-card{
    border-radius:16px; padding:16px; cursor:pointer; border:2.5px solid transparent;
    position:relative; overflow:hidden; min-height:118px; display:flex; flex-direction:column; justify-content:flex-end;
    transition:all .2s ease;
  }
  .concept-card:hover{transform:translateY(-2px);}
  .concept-card.selected{border-color:var(--brick); box-shadow:0 0 0 3px rgba(164,71,42,0.12);}
  .concept-card .ctitle{font-family:'Fraunces'; font-size:16.5px; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,0.25); margin-bottom:3px;}
  .concept-card .cdesc{font-size:11.5px; color:rgba(255,255,255,0.92); font-family:'IBM Plex Mono'; text-shadow:0 1px 4px rgba(0,0,0,0.3);}
  .image-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .image-choice{min-height:150px;border:2.5px solid transparent;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;background-size:cover;background-position:center;display:flex;align-items:flex-end;transition:all .18s ease;box-shadow:0 8px 22px -16px rgba(43,36,30,.45);}
  .image-choice::after{content:'';position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(20,16,12,.72));}
  .image-choice:hover{transform:translateY(-2px);}
  .image-choice.selected{border-color:var(--brick);box-shadow:0 0 0 3px rgba(164,71,42,.12);}
  .image-choice .image-choice-label{position:relative;z-index:2;color:#fff;font-family:'Fraunces';font-size:17px;line-height:1.1;padding:13px;text-shadow:0 1px 5px rgba(0,0,0,.35);}
  .image-choice .image-choice-check{position:absolute;z-index:3;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--river);display:none;align-items:center;justify-content:center;font-weight:700;}
  .image-choice.selected .image-choice-check{display:flex;}
  @media(max-width:560px){.image-choice-grid{grid-template-columns:1fr 1fr;gap:9px}.image-choice{min-height:125px}.image-choice .image-choice-label{font-size:15px;padding:10px;}}

  .color-grid{display:flex; flex-wrap:wrap; gap:14px;}
  .swatch{width:64px; text-align:center; cursor:pointer;}
  .swatch .sw-dot{width:56px; height:56px; border-radius:50%; border:2.5px solid transparent; margin:0 auto 7px; transition:all .15s ease;}
  .swatch.selected .sw-dot{border-color:var(--ink); transform:scale(1.08);}
  .swatch .sw-label{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono';}

  .scale-wrap{margin-top:8px;}
  .scale-poles{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; font-family:'IBM Plex Mono';}
  input[type=range]{width:100%; accent-color:var(--brick); height:5px;}

  .rank-list{display:flex; flex-direction:column; gap:9px;}
  .rank-item{
    display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:12px;
    border:1.5px solid var(--line-strong); background:var(--paper); cursor:pointer; transition:all .15s ease;
  }
  .rank-item.ranked{border-color:var(--gold); background:rgba(196,146,46,0.08);}
  .rank-num{
    width:26px; height:26px; border-radius:50%; background:var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-family:'IBM Plex Mono'; flex-shrink:0;
  }
  .rank-item.ranked .rank-num{background:var(--gold); color:#fff;}

  .textq textarea, .textq input[type=text]{margin-top:2px;}
  .char-note{font-size:11.5px; color:var(--sage); margin-top:6px; font-family:'IBM Plex Mono';}

  /* ---------- THANKS ---------- */
  .thanks-wrap{padding:64px 10px; text-align:center;}
  .thanks-wrap h2{font-size:30px; margin-bottom:14px;}
  .thanks-wrap p{color:var(--ink-soft); max-width:460px; margin:0 auto 30px; line-height:1.6;}
  .thanks-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  /* ---------- DESIGNER ---------- */
  .designer-login{max-width:380px; margin:80px auto; padding:30px; text-align:center;}
  .dna-cloud{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 6px;}
  .dna-chip{
    padding:9px 16px; border-radius:999px; font-family:'IBM Plex Mono'; font-size:12.5px;
    background:var(--ink); color:var(--paper);
  }
  .section-title{display:flex; align-items:baseline; gap:10px; margin:44px 0 16px;}
  .section-title h2{font-size:21px; margin:0;}
  .section-title .count{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--sage);}
  .profile-card{padding:22px; margin-bottom:16px;}
  .profile-card .phead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:6px;}
  .profile-card .phead h3{margin:0; font-size:19px;}
  .bucket{margin-bottom:14px;}
  .bucket .blabel{font-family:'IBM Plex Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--brick); margin-bottom:6px;}
  .bucket ul{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; color:var(--ink);}
  .bucket .empty{font-size:12.5px; color:var(--sage); font-style:italic;}
  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tag-list span{background:rgba(46,92,84,0.1); color:var(--river); padding:4px 10px; border-radius:999px; font-size:12px;}
  .overlap-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:600px){.overlap-grid{grid-template-columns:1fr;}}
  .overlap-card{padding:18px;}
  .overlap-card h4{margin:0 0 10px; font-size:14px; font-family:'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .top-bar .brand{font-family:'Fraunces'; font-size:15px;}
  .small-link{font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline;}
  .footer-note{text-align:center; margin-top:60px; font-size:11.5px; color:var(--sage); font-family:'IBM Plex Mono';}
  .disclaimer{font-size:12px; color:var(--sage); background:rgba(139,154,128,0.12); padding:12px 14px; border-radius:12px; margin-top:22px; line-height:1.5;}
  .loading{padding:100px 10px; text-align:center; color:var(--sage); font-family:'IBM Plex Mono'; font-size:13px;}

/* --- Mejoras: versión intermedia, visual y analítica --- */
.stage-progress{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
  margin:14px 0 24px;
  padding:10px 4px 4px;
}
.stage-item{
  min-width:0;
  text-align:center;
  position:relative;
}
.stage-item::before{
  content:"";
  position:absolute;
  top:15px;
  left:-50%;
  right:50%;
  height:2px;
  background:var(--line);
  z-index:0;
}
.stage-item:first-child::before{display:none}
.stage-dot{
  position:relative;
  z-index:1;
  width:30px;height:30px;
  margin:0 auto 7px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);
  border:1px solid var(--line-strong);
  font-size:11px;font-weight:700;
}
.stage-item.current .stage-dot{background:var(--brick);color:white;border-color:var(--brick)}
.stage-item.done .stage-dot{background:var(--sage);color:white;border-color:var(--sage)}
.stage-label{font-size:10px;line-height:1.2;color:var(--ink-soft);word-break:normal}
.stage-item.current .stage-label{color:var(--ink);font-weight:700}

.kid-style-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
}
.kid-style-card{
  border:1px solid var(--line);border-radius:18px;padding:14px;
  cursor:pointer;background:var(--paper);transition:.15s;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.kid-style-card:hover,.kid-style-card.selected{
  border-color:var(--brick);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(0,0,0,.07);
}
.kid-style-art{
  width:100%;min-height:105px;border-radius:14px;
  background:linear-gradient(135deg,#f4eee4,#dfe9e3);
  display:flex;align-items:center;justify-content:center;
  font-size:45px;letter-spacing:5px;margin-bottom:10px;
}
.kid-style-card strong{font-size:16px;margin-bottom:4px}
.kid-style-card span{font-size:12px;line-height:1.35;color:var(--ink-soft)}

.concept-visual{
  min-height:110px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;letter-spacing:4px;
  background:rgba(255,255,255,.45);margin-bottom:12px;
}
.answer-review{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.answer-review summary{cursor:pointer;font-weight:700;font-size:13px}
.answer-list{margin-top:12px;display:grid;gap:8px}
.answer-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:10px;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.5);
}
.answer-row div{display:flex;flex-direction:column;gap:3px;min-width:0}
.answer-row span{font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere}
.mini-delete,.mini-action{
  font-size:11px!important;padding:7px 10px!important;white-space:nowrap;
}
.profile-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.danger-action{border-color:var(--brick)!important;color:var(--brick)!important;background:rgba(154,65,47,.06)}
.mini-delete{border:1px solid var(--brick);border-radius:8px;background:transparent;color:var(--brick);cursor:pointer}
.mini-delete:hover{background:var(--brick);color:#fff}
.answer-row .mini-delete{pointer-events:auto;position:relative;z-index:5}
[data-clear-answers]{cursor:pointer}
.conclusions-card{margin-bottom:22px}
.conclusion-intro{color:var(--ink-soft);font-size:13px;margin-top:0}
.conclusion-list{margin:0;padding-left:20px}
.conclusion-list li{margin:8px 0;line-height:1.45}

@media(max-width:700px){
  .stage-progress{gap:2px;margin-bottom:18px}
  .stage-dot{width:26px;height:26px;font-size:10px}
  .stage-label{font-size:8px}
  .kid-style-grid{grid-template-columns:1fr 1fr}
}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   CASA HONDA — Diagnóstico de biointeriorismo
   Vanilla JS, un solo archivo. Persistencia via window.storage (compartida
   entre los integrantes de la familia y el panel del diseñador).
   ========================================================================= */

/* ---------------------------------------------------------------------
   0. STORAGE — envoltura con respaldo en memoria si window.storage
   no está disponible (por ejemplo, al abrir el archivo suelto).
--------------------------------------------------------------------- */
const memoryStore = {};
const Store = {
  async get(key){
    // Durante esta sesión, la copia local es la fuente de verdad después
    // de cualquier edición/eliminación. Antes se consultaba primero
    // window.storage, que podía devolver una versión anterior y "revivir"
    // respuestas que acabábamos de borrar.
    if(Object.prototype.hasOwnProperty.call(memoryStore,key)){
      return memoryStore[key];
    }
    try{
      if(window.storage){
        const r = await window.storage.get(key, true);
        if(!r || r.value===undefined || r.value===null || r.value==='null') return null;
        const parsed = JSON.parse(r.value);
        memoryStore[key] = parsed;
        return parsed;
      }
    }catch(e){ /* key no existe todavía */ }
    return null;
  },
  async set(key, value){
    memoryStore[key] = value;
    try{
      if(window.storage){ await window.storage.set(key, JSON.stringify(value), true); }
    }catch(e){ console.warn('Storage set falló, usando memoria', e); }
  },
  async remove(key){
    // Primero eliminamos la copia local.
    delete memoryStore[key];

    if(!window.storage) return true;

    // Algunas implementaciones de window.storage tienen remove(),
    // pero pueden fallar silenciosamente o no aceptar el segundo argumento.
    try{
      if(typeof window.storage.remove === 'function'){
        try{
          await window.storage.remove(key, true);
        }catch(e1){
          try{ await window.storage.remove(key); }catch(e2){}
        }
      }
    }catch(e){}

    // Dejamos explícitamente el valor en null. Esto evita que una respuesta
    // antigua reaparezca si remove() no fue soportado por el almacenamiento.
    try{
      await window.storage.set(key, JSON.stringify(null), true);
    }catch(e1){
      try{ await window.storage.set(key, JSON.stringify(null)); }catch(e2){}
    }

    // Verificación: si todavía existe un valor, se vuelve a sobrescribir.
    try{
      const check = await window.storage.get(key, true);
      if(check && check.value && check.value !== 'null'){
        await window.storage.set(key, JSON.stringify(null), true);
      }
    }catch(e){}

    return true;
  }
};

/* ---------------------------------------------------------------------
   3. SESIÓN — estado en memoria
--------------------------------------------------------------------- */
const Session = {
  screen:'loading',
  people:[],
  currentPerson:null,   // {id,name,age,relation,isChild,complete}
  answers:{},
  path:[],               // ids de preguntas ya mostradas, en orden
  cursor:-1,
  designerUnlocked:false,
};

function isKid(){ return !!(Session.currentPerson && Session.currentPerson.isChild); }

function questionApplies(q, answers){
  if(isKid()){
    if(q.adultOnly) return false;
  }else{
    if(q.kidOnly) return false;
    if(q.kidSkip) return false;
  }
  if(q.condition && !q.condition(answers)) return false;
  return true;
}

const MAX_QUESTIONS_PER_STAGE = 2;

function nextApplicableAfter(currentId){
  const idx = currentId ? QUESTIONS.findIndex(q=>q.id===currentId) : -1;
  const currentStage = currentId ? (QUESTIONS[idx]?.stage || 0) : 0;
  let stageCount = 0;
  if(currentStage){
    for(let i=0;i<=idx;i++){
      if(QUESTIONS[i].stage===currentStage && questionApplies(QUESTIONS[i], Session.answers)) stageCount++;
    }
  }
  for(let i=idx+1; i<QUESTIONS.length; i++){
    const q=QUESTIONS[i];
    if(!questionApplies(q, Session.answers)) continue;
    if(q.stage!==currentStage){ stageCount=0; }
    if(stageCount>=MAX_QUESTIONS_PER_STAGE) continue;
    return q;
  }
  return null;
}

function currentQuestion(){
  if(Session.cursor<0 || Session.cursor>=Session.path.length) return null;
  return QUESTIONS.find(q=>q.id===Session.path[Session.cursor]);
}

/* ---------------------------------------------------------------------
   4. PERSISTENCIA DE PERSONAS
--------------------------------------------------------------------- */
async function loadPeople(){
  const list = await Store.get('family:members');
  Session.people = list || [];
}
async function savePeople(){
  await Store.set('family:members', Session.people);
}
async function saveCurrentAnswers(){
  if(!Session.currentPerson) return;
  await Store.set('answers:'+Session.currentPerson.id, {answers:Session.answers, path:Session.path});
}
async function loadAnswersFor(personId){
  const data = await Store.get('answers:'+personId);
  return data || {answers:{}, path:[]};
}
async function saveAnswersFor(personId, answers, path){
  const payload = {answers:answers||{}, path:path||[]};
  // Store.set actualiza memoryStore inmediatamente y después intenta
  // persistir en window.storage.
  await Store.set('answers:'+personId, payload);
  // Reafirmamos la copia local para que un get posterior no pueda recuperar
  // una versión vieja desde window.storage.
  memoryStore['answers:'+personId] = payload;
}

function uid(){ return 'p_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ---------------------------------------------------------------------
   5. NAVEGACIÓN DE PREGUNTAS
--------------------------------------------------------------------- */
async function goNext(){
  const q = currentQuestion();
  if(q && q.required!==false && !answered(q)){
    flashRequired();
    return;
  }
  await saveCurrentAnswers();

  if(Session.cursor < Session.path.length-1){
    Session.cursor++;
  }else{
    const nq = nextApplicableAfter(q ? q.id : null);
    if(nq){
      Session.path.push(nq.id);
      Session.cursor++;
    }else{
      await finishPerson();
      return;
    }
  }
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function goPrev(){
  if(Session.cursor>0){ Session.cursor--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
}

function answered(q){
  const v = Session.answers[q.id];
  if(q.type==='multi' || q.type==='rank' || (q.type==='imageChoice' && q.multi)) return Array.isArray(v) && v.length>0;
  if(q.type==='color' && q.multi) return Array.isArray(v) && v.length>0;
  if(v===undefined || v===null || v==='') return false;
  return true;
}

let requiredFlash = false;
function flashRequired(){
  requiredFlash = true;
  render();
  setTimeout(()=>{ requiredFlash=false; }, 900);
}

async function finishPerson(){
  Session.currentPerson.complete = true;
  Session.currentPerson.updatedAt = Date.now();
  const idx = Session.people.findIndex(p=>p.id===Session.currentPerson.id);
  if(idx>=0) Session.people[idx] = Session.currentPerson;
  await savePeople();
  await saveCurrentAnswers();
  Session.screen = 'thanks';
  render();
}

--------------------------------------------------------------------- */
function labelFor(q, value){
  if(q.type==='color'){
    const sw = COLOR_SWATCHES.find(c=>c.value===value);
    return sw ? sw.label : value;
  }
  if(q.id==='style_house' && isKid()){
    const visuals = {
      natural: {emoji:'🌳🦋', title:'Casa naturaleza', desc:'Plantas, árboles, agua y materiales naturales'},
      calida: {emoji:'🏡🧸', title:'Casa acogedora', desc:'Un lugar cómodo para estar con la familia'},
      serena: {emoji:'🌊☁️', title:'Casa tranquila', desc:'Fresca, calmada y perfecta para descansar'},
      creativa: {emoji:'🎨🌈', title:'Casa divertida', desc:'Colores, formas y rincones para crear'},
      aventurera: {emoji:'🧭🌴', title:'Casa exploradora', desc:'Un lugar para descubrir y vivir aventuras'}
    };
    return `<div class="kid-style-grid">${q.options.map(o=>{
      const x=visuals[o.value];
      return `<div class="kid-style-card ${v===o.value?'selected':''}" data-value="${o.value}">
        <div class="kid-style-art">${x.emoji}</div>
        <strong>${x.title}</strong><span>${x.desc}</span>
      </div>`;
    }).join('')}</div>`;
  }
  if(q.type==='concept'){
    const c = CONCEPTS.find(c=>c.value===value);
    return c ? c.label : value;
  }
  if(q.options){
    const o = q.options.find(o=>o.value===value);
    return o ? o.label : value;
  }
  return value;
}

function collectSelections(answers){
  // Devuelve lista de {label, tags[]} de todo lo seleccionado (chips/colores/conceptos/rank)
  const out = [];
  QUESTIONS.forEach(q=>{
    const v = answers[q.id];
    if(v===undefined || v===null) return;
    if(q.type==='multi' || q.type==='rank' || (q.type==='color' && q.multi) || (q.type==='imageChoice' && q.multi)){
      (Array.isArray(v)?v:[]).forEach(val=>{
        const opt = (q.options||[]).find(o=>o.value===val) || (q.type==='color'?COLOR_SWATCHES.find(c=>c.value===val):null);
        out.push({label: labelFor(q,val), tags:(opt&&opt.tags)||[]});
      });
    }else if(q.type==='single' || q.type==='color' || q.type==='concept'){
      const opt = (q.options||[]).find(o=>o.value===v) || (q.type==='color'?COLOR_SWATCHES.find(c=>c.value===v):null) || (q.type==='concept'?CONCEPTS.find(c=>c.value===v):null);
      out.push({label: labelFor(q,v), tags:(opt&&opt.tags)||[]});
    }
  });
  return out;
}

function buildPersonProfile(person, answers){
  const buckets = {humano:[], sensorial:[], espacial:[], estetico:[], familiar:[], emocional:[], privacidad:[], naturaleza:[], memoria:[], futuro:[]};
  QUESTIONS.forEach(q=>{
    const v = answers[q.id];
    if(v===undefined || v===null || v==='' || (Array.isArray(v)&&v.length===0)) return;
    let text;
    if(q.type==='text'){ text = q.text.replace(/\s*\(opcional\)/,'')+' → “'+v+'”'; }
    else if(Array.isArray(v)){ text = q.text+': '+v.map(val=>labelFor(q,val)).join(', '); }
    else if(q.type==='scale'){ text = q.text+': '+v+'/5 ('+q.poleLeft+' ↔ '+q.poleRight+')'; }
    else { text = q.text+': '+labelFor(q,v); }
    const b = buckets[q.bucket] || buckets.humano;
    b.push(text);
  });

  // Insights de biointeriorismo a partir de tags recolectados
  const sels = collectSelections(answers);
  const tagCount = {};
  sels.forEach(s=> s.tags.forEach(t=> tagCount[t]=(tagCount[t]||0)+1));
  if((answers.vegetacion_importancia||0)>=4) tagCount.naturaleza=(tagCount.naturaleza||0)+2;
  if((answers.interior_exterior||0)>=4) tagCount.ventilacion=(tagCount.ventilacion||0)+2;
  if((answers.invitados_privacidad||0)>=4 || answers.estar_solo) tagCount.privacidad=(tagCount.privacidad||0)+2;
  if((answers.comer_juntos||0)>=4 || (answers.actividades_juntos||[]).length>=3) tagCount.social=(tagCount.social||0)+2;
  if((answers.silencio_actividad||0)<=2) tagCount.descanso=(tagCount.descanso||0)+2;

  const sortedTags = Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]).slice(0,5);
  const insights = sortedTags.map(t=>BIO_PHRASES[t]).filter(Boolean);

  return {buckets, insights, selections:sels};
}

function familyDNA(allSelections, topN){
  const freq = {};
  const order = [];
  allSelections.forEach(s=>{
    if(!(s.label in freq)){ order.push(s.label); }
    freq[s.label] = (freq[s.label]||0)+1;
  });
  return order.sort((a,b)=>freq[b]-freq[a]).slice(0, topN||10);
}

      </div>
      <div class="row-actions" style="margin-top:22px;">
        <div></div>
        <button class="btn brick" data-action="create-person">Empezar mi cuestionario</button>
      </div>
    </div>
    
  `;

  app.querySelectorAll('[data-person]').forEach(el=>{
    el.onclick = async ()=>{
      const p = Session.people.find(x=>x.id===el.dataset.person);
      const data = await loadAnswersFor(p.id);
      Session.currentPerson = p;
      Session.answers = data.answers || {};
      Session.path = data.path || [];
      Session.cursor = Session.path.length ? Session.path.length-1 : -1;
      if(p.complete){
        Session.screen='thanks';
      }else{
        if(Session.path.length===0){
          const nq = nextApplicableAfter(null);
          if(nq){ Session.path=[nq.id]; Session.cursor=0; }
        }
        Session.screen='question';
      }
      render();
    };
  });

  const ageInput = app.querySelector('#np-age');
  const kidCheckbox = app.querySelector('#np-kid');
  ageInput.oninput = ()=>{ kidCheckbox.checked = (+ageInput.value>0 && +ageInput.value<13); };

  app.querySelector('[data-action=create-person]').onclick = async ()=>{
    const name = app.querySelector('#np-name').value.trim();
    if(!name){ app.querySelector('#np-name').style.borderColor='var(--brick)'; return; }
    const age = +app.querySelector('#np-age').value || null;
    const relation = app.querySelector('#np-relation').value;
    const isChild = kidCheckbox.checked;
    const person = {id:uid(), name, age, relation, isChild, complete:false, createdAt:Date.now()};
    Session.people.push(person);
    await savePeople();
    Session.currentPerson = person;
    Session.answers = {};
    const first = nextApplicableAfter(null);
    Session.path = first? [first.id] : [];
    Session.cursor = first? 0 : -1;
    Session.screen='question';
    render();
  };
}

function riverBar(currentStageN){
  const items = STAGES.map(s=>{
    let cls = '';
    if(s.n < currentStageN) cls='done';
    if(s.n === currentStageN) cls='current';
    return `<div class="stage-item ${cls}">
      <div class="stage-dot">${s.n < currentStageN ? '✓' : s.n}</div>
      <div class="stage-label">${escapeHtml(s.label)}</div>
    </div>`;
  }).join('');
  return `<div class="stage-progress" aria-label="Progreso del cuestionario">${items}</div>`;
}

function renderQuestion(){
  const q = currentQuestion();
  if(!q){ Session.screen='select-person'; return render(); }

  const stageInfo = STAGES.find(s=>s.n===q.stage);
  const isFirstOfStage = Session.cursor===0 || QUESTIONS.find(pq=>pq.id===Session.path[Session.cursor-1]).stage !== q.stage;
  const interstitial = null;

  let body = '';
  if(interstitial){
    body += `<div class="interstitial"><p>${interstitial}</p></div>`;
  }

  body += `
    <div class="card q-card ${requiredFlash?'':''}">
      <div class="eyebrow q-eyebrow">${stageInfo.label.toUpperCase()} · ${Session.currentPerson.name}${isKid()?' (modo sencillo)':''}</div>
      <h2 class="q-text">${isKid() && q.kidText ? q.kidText : q.text}</h2>
      ${requiredFlash ? '<p class="q-help" style="color:var(--brick);">Selecciona o escribe una respuesta para continuar.</p>' : ''}
      <div class="q-body">${renderQuestionInput(q)}</div>
    </div>
  `;

  app.innerHTML = `
    <div class="top-bar"><div class="brand">Casa Honda</div><span class="small-link" data-action="switch">cambiar de persona</span></div>
    <div class="river-wrap">${riverBar(q.stage)}</div>
    ${body}
    <div class="row-actions">
      <button class="btn secondary" data-action="prev" ${Session.cursor<=0?'disabled':''}>← Anterior</button>
      <button class="btn brick" data-action="next">Continuar →</button>
    </div>
  `;

  bindQuestionInput(q);
  app.querySelector('[data-action=next]').onclick = goNext;
  app.querySelector('[data-action=prev]').onclick = goPrev;
  app.querySelector('[data-action=switch]').onclick = async ()=>{
    await saveCurrentAnswers();
    Session.screen='select-person';
    render();
  };
}

function renderQuestionInput(q){
  const v = Session.answers[q.id];
  if(q.type==='text'){
    const tag = q.short ? 'input type="text"' : 'textarea';
    const closeTag = q.short ? '' : '</textarea>';
    return `<div class="textq">
      <${tag} id="qinput" placeholder="${q.placeholder||'Escribe aquí…'}" ${q.short?`value="${escapeHtml(v||'')}"`:''}>${q.short?'':escapeHtml(v||'')}${closeTag}
    </div>`;
  }
  if(q.type==='single'){
    return `<div class="chip-grid">${q.options.map(o=>`
      <div class="chip ${v===o.value?'selected':''}" data-value="${o.value}">${o.em?`<span class="em">${o.em}</span>`:''}${o.label}</div>
    `).join('')}</div>`;
  }
  if(q.type==='multi'){
    const arr = v||[];
    return `<div class="chip-grid">${q.options.map(o=>`
      <div class="chip ${arr.includes(o.value)?'selected':''}" data-value="${o.value}">${o.em?`<span class="em">${o.em}</span>`:''}${o.label}</div>
    `).join('')}</div><div class="maxnote">Elige hasta ${q.multiMax||3}</div>`;
  }
  if(q.type==='scale'){
    const val = v!==undefined? v : 3;
    return `<div class="scale-wrap">
      <div class="scale-poles"><span>${q.poleLeft}</span><span>${q.poleRight}</span></div>
      <input type="range" min="1" max="5" step="1" id="qinput" value="${val}">
    </div>`;
  }
  if(q.type==='color'){
    if(q.multi){
      const arr = v||[];
      return `<div class="color-grid">${COLOR_SWATCHES.map(c=>`
        <div class="swatch ${arr.includes(c.value)?'selected':''}" data-value="${c.value}">
          <div class="sw-dot" style="background:${c.hex}; ${c.value==='blanco-cal'?'border-color:var(--line-strong);':''}"></div>
          <div class="sw-label">${c.label}</div>
        </div>`).join('')}</div><div class="maxnote">Elige hasta ${q.multiMax||4}</div>`;
    }
    return `<div class="color-grid">${COLOR_SWATCHES.map(c=>`
      <div class="swatch ${v===c.value?'selected':''}" data-value="${c.value}">
        <div class="sw-dot" style="background:${c.hex}; ${c.value==='blanco-cal'?'border-color:var(--line-strong);':''}"></div>
        <div class="sw-label">${c.label}</div>
      </div>`).join('')}</div>`;
  }
  if(q.id==='style_house' && isKid()){
    const visuals = {
      natural: {emoji:'🌳🦋', title:'Casa naturaleza', desc:'Plantas, árboles, agua y materiales naturales'},
      calida: {emoji:'🏡🧸', title:'Casa acogedora', desc:'Un lugar cómodo para estar con la familia'},
      serena: {emoji:'🌊☁️', title:'Casa tranquila', desc:'Fresca, calmada y perfecta para descansar'},
      creativa: {emoji:'🎨🌈', title:'Casa divertida', desc:'Colores, formas y rincones para crear'},
      aventurera: {emoji:'🧭🌴', title:'Casa exploradora', desc:'Un lugar para descubrir y vivir aventuras'}
    };
    return `<div class="kid-style-grid">${q.options.map(o=>{
      const x=visuals[o.value];
      return `<div class="kid-style-card ${v===o.value?'selected':''}" data-value="${o.value}">
        <div class="kid-style-art">${x.emoji}</div>
        <strong>${x.title}</strong><span>${x.desc}</span>
      </div>`;
    }).join('')}</div>`;
  }
  if(q.type==='concept'){
    return `<div class="concept-grid">${CONCEPTS.map(c=>`
      <div class="concept-card ${v===c.value?'selected':''}" data-value="${c.value}" style="background-image:linear-gradient(160deg,rgba(43,36,30,.12),rgba(43,36,30,.52)),url('${c.image}');background-size:cover;background-position:center;">
        <div class="ctitle">${c.label}</div>
        <div class="cdesc">${c.desc}</div>
      </div>`).join('')}</div>`;
  }
  if(q.type==='imageChoice'){
    const arr = q.multi ? (v||[]) : [];
    return `<div class="image-choice-grid">${q.options.map(o=>`
      <div class="image-choice ${(q.multi?arr.includes(o.value):v===o.value)?'selected':''}" data-value="${o.value}" style="background-image:url('${o.image}')">
        <span class="image-choice-check">✓</span><span class="image-choice-label">${o.label}</span>
      </div>`).join('')}</div>${q.multi?`<div class="maxnote">Elige hasta ${q.multiMax||2}</div>`:''}`;
  }
  if(q.type==='rank'){
    const arr = v||[]; // array de values en orden elegido
    return `<div class="rank-list">${q.options.map(o=>{
      const pos = arr.indexOf(o.value);
      return `<div class="rank-item ${pos>=0?'ranked':''}" data-value="${o.value}">
        <div class="rank-num">${pos>=0?pos+1:''}</div>
        <div>${o.label}</div>
      </div>`;
    }).join('')}</div>`;
  }
  return '';
}

function bindQuestionInput(q){
  if(q.type==='text'){
    const el = document.getElementById('qinput');
    el.oninput = ()=>{ Session.answers[q.id] = el.value; };
    return;
  }
  if(q.type==='single'){
    app.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{ Session.answers[q.id]=c.dataset.value; renderQuestion(); };
    });
    return;
  }
  if(q.type==='multi'){
    app.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{
        let arr = Session.answers[q.id] ? [...Session.answers[q.id]] : [];
        const val = c.dataset.value;
        if(arr.includes(val)){ arr = arr.filter(x=>x!==val); }
        else{
          if(arr.length>=(q.multiMax||3)) return;
          arr.push(val);
        }
        Session.answers[q.id]=arr;
        renderQuestion();
      };
    });
    return;
  }
  if(q.type==='scale'){
    const el = document.getElementById('qinput');
    Session.answers[q.id] = Session.answers[q.id]!==undefined ? Session.answers[q.id] : 3;
    el.oninput = ()=>{ Session.answers[q.id] = +el.value; };
    return;
  }
  if(q.type==='color'){
    app.querySelectorAll('.swatch').forEach(s=>{
      s.onclick = ()=>{
        if(q.multi){
          let arr = Session.answers[q.id] ? [...Session.answers[q.id]] : [];
          const val = s.dataset.value;
          if(arr.includes(val)){ arr = arr.filter(x=>x!==val); }
          else{
            if(arr.length>=(q.multiMax||4)) return;
            arr.push(val);
          }
          Session.answers[q.id]=arr;
        }else{
          Session.answers[q.id]=s.dataset.value;
        }
        renderQuestion();
      };
    });
    return;
  }
  if(q.id==='style_house' && isKid()){
    const visuals = {
      natural: {emoji:'🌳🦋', title:'Casa naturaleza', desc:'Plantas, árboles, agua y materiales naturales'},
      calida: {emoji:'🏡🧸', title:'Casa acogedora', desc:'Un lugar cómodo para estar con la familia'},
      serena: {emoji:'🌊☁️', title:'Casa tranquila', desc:'Fresca, calmada y perfecta para descansar'},
      creativa: {emoji:'🎨🌈', title:'Casa divertida', desc:'Colores, formas y rincones para crear'},
      aventurera: {emoji:'🧭🌴', title:'Casa exploradora', desc:'Un lugar para descubrir y vivir aventuras'}
    };
    return `<div class="kid-style-grid">${q.options.map(o=>{
      const x=visuals[o.value];
      return `<div class="kid-style-card ${v===o.value?'selected':''}" data-value="${o.value}">
        <div class="kid-style-art">${x.emoji}</div>
        <strong>${x.title}</strong><span>${x.desc}</span>
      </div>`;
    }).join('')}</div>`;
  }
  if(q.id==='style_house' && isKid()){
    app.querySelectorAll('.kid-style-card').forEach(c=>{
      c.onclick = ()=>{ Session.answers[q.id]=c.dataset.value; renderQuestion(); };
    });
    return;
  }
  if(q.type==='concept'){
    app.querySelectorAll('.concept-card').forEach(c=>{
      c.onclick = ()=>{ Session.answers[q.id]=c.dataset.value; renderQuestion(); };
    });
    return;
  }
  if(q.type==='imageChoice'){
    app.querySelectorAll('.image-choice').forEach(c=>{
      c.onclick = ()=>{
        const val=c.dataset.value;
        if(q.multi){
          let arr=Session.answers[q.id] ? [...Session.answers[q.id]] : [];
          if(arr.includes(val)) arr=arr.filter(x=>x!==val);
          else { if(arr.length >= (q.multiMax||2)) return; arr.push(val); }
          Session.answers[q.id]=arr;
        }else{ Session.answers[q.id]=val; }
        renderQuestion();
      };
    });
    return;
  }
  if(q.type==='rank'){
    app.querySelectorAll('.rank-item').forEach(r=>{
      r.onclick = ()=>{
        let arr = Session.answers[q.id] ? [...Session.answers[q.id]] : [];
        const val = r.dataset.value;
        if(arr.includes(val)){ arr = arr.filter(x=>x!==val); }
        else{ arr.push(val); }
        Session.answers[q.id]=arr;
        renderQuestion();
      };
    });
    return;
  }
}

async function renderDesigner(){

    profiles.push({person:p, answers:data.answers||{}, ...buildPersonProfile(p, data.answers||{})});

  profiles.forEach(pr=>{

      labelOwners[s.label] = labelOwners[s.label] || new Set();
      labelOwners[s.label].add(pr.person.name);

    <h2 style="font-size:28px; margin:6px 0 4px;">ADN de la casa</h2>
    <p style="color:var(--ink-soft); margin-top:0;">Conceptos derivados de las respuestas de ${people.length} integrante${people.length===1?'':'s'}.</p>
    <div class="dna-cloud">${dna.length? dna.map(d=>`<span class="dna-chip">${escapeHtml(d)}</span>`).join('') : '<span class="dna-chip">Aún no hay suficientes respuestas</span>'}</div>

    <div class="section-title"><h2>Conclusiones de diseño</h2></div>
    <div class="card conclusions-card">
      <p class="conclusion-intro">Síntesis preliminar que traduce preferencias, hábitos, recuerdos y necesidades en criterios de diseño. Se actualiza automáticamente al cambiar las respuestas.</p>
      <ul class="conclusion-list">${conclusions.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul>
      <div class="answer-review">
        <summary style="cursor:default;list-style:none;font-weight:700;font-size:13px;">Memorias y sensibilidades que vale la pena conservar</summary>
        <div class="answer-list">${familyAnswers.filter(a=>['infancia_espacio_favorito','infancia_elemento_evoca','texturas_no_gustan','memoria_lugar'].includes(a.qid) && String(a.val||'').trim()).map(a=>{ const q=QUESTIONS.find(x=>x.id===a.qid); return `<div class="answer-row"><div><strong>${escapeHtml(a.person.name)} · ${escapeHtml(q?q.text:a.qid)}</strong><span>${escapeHtml(Array.isArray(a.val)?a.val.join(', '):String(a.val))}</span></div></div>`; }).join('') || '<div class="empty">Aún no hay respuestas de memoria o rechazo sensorial.</div>'}</div>
      </div>
    </div>

    <div class="section-title"><h2>Coincidencias y diferencias</h2></div>
    <div class="overlap-grid">
      <div class="card overlap-card">
        <h4>Puntos en común</h4>
        <div class="tag-list">${coincidencias.length? coincidencias.map(c=>`<span>${escapeHtml(c)}</span>`).join('') : '<span class="empty" style="color:var(--sage)">Ninguno todavía</span>'}</div>
      </div>
      <div class="card overlap-card">
        <h4>Particularidades individuales</h4>
        <div class="tag-list">${diferencias.length? diferencias.map(c=>`<span>${escapeHtml(c)}</span>`).join('') : '<span class="empty" style="color:var(--sage)">Ninguna todavía</span>'}</div>
      </div>
    </div>

    <div class="section-title"><h2>Perfiles individuales</h2><span class="count">${people.length} persona${people.length===1?'':'s'}</span></div>
    ${profileCards || '<p style="color:var(--sage);">Nadie ha respondido el cuestionario todavía.</p>'}

    <div class="disclaimer">Estos resultados son insumos de diseño derivados de preferencias declaradas por la familia. No constituyen ningún tipo de diagnóstico psicológico ni clínico.</div>
    <div class="footer-note">Casa Honda · Tolima — diagnóstico de biointeriorismo</div>
  `;
  app.querySelectorAll('[data-delete-answer]').forEach(btn=>{
    btn.onclick = async (event)=>{
      event.preventDefault();
      event.stopPropagation();

      const personId=btn.dataset.deleteAnswer;
      const qid=btn.dataset.qid;
      const p=Session.people.find(x=>x.id===personId);
      const data=await loadAnswersFor(personId);

      if(!data || !data.answers || !Object.prototype.hasOwnProperty.call(data.answers,qid)){
        alert('La respuesta ya no está guardada.');
        return;
      }

      const q=QUESTIONS.find(x=>x.id===qid);
      const questionLabel=q ? (q.text || q.kidText || qid) : qid;

      if(!window.confirm(`¿Eliminar esta respuesta de ${p ? p.name : 'esta persona'}?\n\n${questionLabel}`)) return;

      const updatedAnswers = Object.assign({}, data.answers);
      delete updatedAnswers[qid];
      const updatedPath = Array.isArray(data.path) ? data.path.filter(x=>x!==qid) : [];

      // Esta es la operación fundamental: usamos exactamente el mismo
      // método que utiliza el formulario para GUARDAR respuestas.
      await saveAnswersFor(personId, updatedAnswers, updatedPath);

      // Verificación contra la misma fuente que usa el panel.
      const check=await loadAnswersFor(personId);
      if(check.answers && Object.prototype.hasOwnProperty.call(check.answers,qid)){
        alert('No se pudo confirmar la eliminación. Intenta nuevamente.');
        return;
      }

      renderDesigner();
    };
  });
  app.querySelectorAll('[data-clear-answers]').forEach(btn=>{
    btn.onclick = async (event)=>{
      event.preventDefault();
      event.stopPropagation();

      const id=btn.dataset.clearAnswers;
      const p=Session.people.find(x=>x.id===id);
      if(!p) return;

      if(!window.confirm(`¿Borrar TODAS las respuestas de ${p.name}? La persona seguirá en el formulario.`)) return;

      // No dependemos de remove(). Guardamos un conjunto vacío usando
      // exactamente la misma ruta de persistencia del cuestionario.
      await saveAnswersFor(id, {}, []);

      Session.people = Session.people.map(person =>
        person.id===id ? {...person, complete:false, updatedAt:Date.now()} : person
      );
      await savePeople();

      if(Session.currentPerson && Session.currentPerson.id===id){
        Session.answers={};
        Session.path=[];
      }

      const check=await loadAnswersFor(id);
      if(Object.keys(check.answers||{}).length!==0){
        alert('No se pudo confirmar el borrado. Intenta nuevamente.');
        return;
      }

      renderDesigner();
    };
  });
  app.querySelectorAll('[data-delete-person]').forEach(btn=>{
    btn.onclick = async (event)=>{
      event.preventDefault();
      event.stopPropagation();

      const id=btn.dataset.deletePerson;
      const p=Session.people.find(x=>x.id===id);
      if(!p) return;

      if(!window.confirm(`¿Eliminar a ${p.name} y TODAS sus respuestas? Esta acción no se puede deshacer.`)) return;

      await saveAnswersFor(id, {}, []);
      delete memoryStore['answers:'+id];

      Session.people=Session.people.filter(x=>x.id!==id);
      await savePeople();

      if(Session.currentPerson && Session.currentPerson.id===id){
        Session.currentPerson=null;
        Session.answers={};
        Session.path=[];
      }

      renderDesigner();
    };
  });
  app.querySelectorAll('[data-edit-person]').forEach(btn=>{
    btn.onclick = async ()=>{
      const p=Session.people.find(x=>x.id===btn.dataset.editPerson);
      if(!p) return;
      const name=prompt('Nombre:',p.name);
      if(name===null) return;
      const age=prompt('Edad aproximada:',p.age||'');
      p.name=name.trim()||p.name;
      p.age=age?+age:p.age;
      await savePeople();
      renderDesigner();
    };
  });
  app.querySelector('[data-action=exit]').onclick = ()=>{ Session.screen='select-person'; render(); };
}

async function clearPersonAnswers(personId){
  // El formulario realmente persiste las respuestas mediante window.storage/Store.
  // Por eso el borrado también debe usar exactamente la misma capa de persistencia.
  await Store.remove('answers:'+personId);
  return true;
}

async function deleteAnswersFor(personId){
  return clearPersonAnswers(personId);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------------------------------------------------
   8. ARRANQUE
--------------------------------------------------------------------- */
(async function init(){
  await loadPeople();
  Session.screen = 'welcome';
  render();
})();
</script>
</body>
</html>
